name: Build & Sync Versioned Android APK to Repo

on:
  push:
    paths-ignore:
      - '*.apk'
      - 'releases/*.apk'
      - 'public/*.apk'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-commit-apk:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install ImageMagick for APK Asset Optimization
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Install Dependencies
        run: npm install

      - name: Read Version from package.json
        id: pkg
        run: |
          VERSION=$(node -p "require('./package.json').version || '3.0.0'")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building Simple-Android-v${VERSION}.apk"

      - name: Build Production Bundle & Signed Android APK (JAR v1 + Scheme v2)
        run: npm run build:apk

      - name: Commit & Push Updated Versioned APK Files to GitHub Repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm --ignore-unmatch Simple-Android-v*.apk releases/Simple-v*.apk public/Simple-Android-v*.apk || true
          git add -f Simple-Android.apk "Simple-Android-v${{ steps.pkg.outputs.version }}.apk" "releases/Simple-v${{ steps.pkg.outputs.version }}.apk" public/Simple-Android.apk "public/Simple-Android-v${{ steps.pkg.outputs.version }}.apk"
          if ! git diff --staged --quiet; then
            git commit -m "chore(apk): build & sync Simple-Android-v${{ steps.pkg.outputs.version }}.apk [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "APK files are already up to date."
          fi

      - name: Publish Versioned APK to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.pkg.outputs.version }}"
          APK_VERSIONED="Simple-Android-v${{ steps.pkg.outputs.version }}.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK_VERSIONED" "Simple-Android.apk" "releases/Simple-v${{ steps.pkg.outputs.version }}.apk" --clobber
          else
            gh release create "$TAG" "$APK_VERSIONED" "Simple-Android.apk" "releases/Simple-v${{ steps.pkg.outputs.version }}.apk" \
              --title "Simple Android Messenger $TAG" \
              --notes "Cryptographically signed native Android APK ($TAG) with real cryptographic OTP verification (Google Sign-In, RFC 6238 Authenticator TOTP, Live SMTP/SMS Gateways) and hardened account database."
          fi

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Simple-Android-v${{ steps.pkg.outputs.version }}-APK
          path: |
            Simple-Android-v${{ steps.pkg.outputs.version }}.apk
            Simple-Android.apk
            releases/Simple-v${{ steps.pkg.outputs.version }}.apk
          if-no-files-found: error
