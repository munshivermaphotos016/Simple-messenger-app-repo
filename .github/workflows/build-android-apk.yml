name: Build & Publish Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Build Production Bundle & Signed Android APK
        run: npm run build:apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Simple-Android-APK
          path: |
            Simple-Android.apk
            releases/Simple-v1.0.0.apk
          if-no-files-found: error
